name: Pagamento ArtiSys CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  test:
    name: Node + Worker D1 + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar Wrangler
        run: npm install --no-audit --no-fund
      - name: Testes Node e Worker
        run: npm run check
      - name: Testes do pipeline seguro R2
        run: python3 -m unittest discover -s test -p 'test_*sync.py'
      - name: Validar manifesto GitHub/Drive (sem segredos)
        run: |
          mkdir -p .release-sync
          node scripts/export-release-manifest.mjs > .release-sync/manifest.json
          python3 scripts/sync_system_releases.py --validate-only
      - name: Teste local Worker D1
        run: npm run test:worker
      - name: Chromium para QA da interface
        run: npx playwright install --with-deps chromium
      - name: QA do painel iPhone + desktop (Playwright)
        run: npm run test:ui
      - name: Capturas do QA visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pagamento-artisys-admin-mobile-qa
          path: qa-shots/
          if-no-files-found: ignore
      - name: Empacotar Worker sem publicar
        run: npx wrangler deploy --dry-run --outdir .wrangler/build
