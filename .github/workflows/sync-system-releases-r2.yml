name: ArtiSys · Sincronizar instaladores no R2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-system-releases-r2.yml'
      - 'src/system-releases.mjs'
      - 'scripts/export-release-manifest.mjs'
      - 'scripts/sync_system_releases.py'
      - 'scripts/sync_releases_via_worker.py'
      - 'src/github-oidc.mjs'
      - 'src/system-release-admin.mjs'
      - 'src/cloudflare-worker.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artisys-system-releases-r2
  cancel-in-progress: false

jobs:
  validate:
    name: Validar manifesto — 4 sistemas / 8 instaladores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exportar manifesto canônico
        run: |
          mkdir -p .release-sync
          node scripts/export-release-manifest.mjs > .release-sync/manifest.json
      - name: Verificar hashes, origens e IDs (sem credenciais)
        run: python scripts/sync_system_releases.py --validate-only

  upload:
    name: Copiar binários ao R2 via OIDC sem segredos
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exportar manifesto canônico dos quatro sistemas
        run: |
          mkdir -p .release-sync
          node scripts/export-release-manifest.mjs > .release-sync/manifest.json
      - name: Validar manifesto e pacote de transferência (sem chaves permanentes)
        run: |
          python scripts/sync_releases_via_worker.py --validate-only
          python -m unittest discover -s test -p 'test_*sync.py'
      - name: Sincronizar instaladores de GitHub Releases/Artifacts com R2 privado
        run: python scripts/sync_releases_via_worker.py
