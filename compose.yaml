services:
  pagamento-artisys:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      DB_PATH: /app/data/payments.sqlite
      RELEASES_DIR: /app/data/releases
    ports:
      - "127.0.0.1:3080:3080"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
